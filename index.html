<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>GESTÃOMAX - Rh, Stock & Vendas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="icon.png">
    <script src="jspdf.min.js"></script>
    <script src="qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
    body{font-family: Arial; padding: 20px;}
   .container{max-width: 1400px; margin:auto;}
    input,button{margin:5px 0;}
   .role-btn{border:1px solid #ddd;background:white;border-radius:8px;padding:8px;font-weight:bold;font-size:13px;cursor:pointer}
   .role-btn.ativo{background:#0d6efd;color:white;border-color:#0d6efd}
    </style>
</head>
<body class="bg-light">
<div id="telaLicenca" class="container mt-5" style="max-width:460px;display:none;">
    <div class="card shadow border-warning">
       <div class="card-header bg-warning text-center"><h4>GESTAMAX MZ</h4><small id="motivoLicenca">Sistema Licenciado</small></div>
        <div class="card-body">
            <div id="areaLicencaInfo" style="background:#fff3e0;padding:12px;border-radius:8px;font-size:13px"></div>
            <input id="codigoLicenca" class="form-control mt-3" placeholder="GMAX-... ou DEMO">
            <input id="inputChave" style="display:none">
            <button onclick="ativarLicenca()" class="btn btn-warning w-100 mt-3">Ativar</button>
            <button onclick="usarDemo()" class="btn btn-outline-secondary w-100 btn-sm mt-2">DEMO 7 dias</button>
        </div>
    </div>
</div>
<div id="telaLogin" class="container mt-5" style="max-width:400px;display:none;">
    <div class="card shadow">
       <div class="card-header bg-primary text-white text-center"><h4>GESTAMAX</h4><small>Sistema Integrado</small></div>
        <div class="card-body">
            <div class="d-flex gap-2 mb-3">
                <button class="role-btn flex-fill ativo" id="rAdmin" onclick="setRole('admin')">Sou Dono</button>
                <button class="role-btn flex-fill" id="rFunc" onclick="setRole('func')">Funcionario</button>
                <button class="role-btn flex-fill" id="rCliente" onclick="setRole('cliente')">Cliente</button>
            </div>
            <div id="loginDono">
                <input id="usuario" class="form-control" value="admin"><input id="senha" type="password" class="form-control" value="1234">
                <button onclick="fazerLogin()" class="btn btn-primary w-100">Entrar</button>
                <p id="erroLogin" style="display:none;color:red">Erro</p>
                <a href="#" onclick="telaLicenca('Trocar licenca')">Trocar licenca</a>
            </div>
            <div id="loginFunc" style="display:none;"><input id="codFunc" class="form-control"><button onclick="entrarFunc()" class="btn btn-primary w-100">Ver</button></div>
            <div id="loginCliente" style="display:none;"><button onclick="entrarCliente()" class="btn w-100" style="background:#25D366;color:white">Catalogo</button></div>
        </div>
    </div>
</div>
<div id="sistema" style="display:none;">
    <div class="container mt-4">
        <div class="card shadow"><div class="card-header bg-primary text-white d-flex justify-content-between"><h2 class="fs-5">GESTAMAX</h2><button onclick="logout()" class="btn btn-danger btn-sm">Sair</button></div>
        <div class="card-body">
            <h4>Cadastrar Funcionario</h4>
            <div class="row g-3 mb-3">
                <div class="col-md-3"><input id="nome" class="form-control" placeholder="Nome"></div>
                <div class="col-md-2"><select id="tipoInstituicao" class="form-select"><option value="">Tipo</option><option value="EMP">Empresa</option><option value="ESC">Escola</option></select></div>
                <div class="col-md-2"><select id="departamento" class="form-select"><option value="">Departamento</option></select></div>
                <div class="col-md-2"><input id="salario" type="number" class="form-control" placeholder="Salario"></div>
                <div class="col-md-2"><input id="faltas" type="number" class="form-control" placeholder="Faltas"></div>
                <div class="col-md-1"><input id="bonus" type="number" class="form-control" placeholder="Bonus"></div>
            </div>
            <button onclick="adicionarFuncionario()" class="btn btn-primary mb-4">Adicionar</button>
            <div class="row mb-3">
                <div class="col-md-5"><input id="TC" class="form-control" placeholder="Pesquisar"></div>
                <div class="col-md-3"><select id="Direcao" class="form-select"><option value="">Filtrar Depto</option></select></div>
                <div class="col-md-4"><button onclick="limparFiltros()" class="btn btn-secondary btn-sm">Limpar</button><button onclick="listarFuncionarios()" class="btn btn-success btn-sm ms-2">Listar Todos</button></div>
            </div>
            <button onclick="baixarBackup()" class="btn btn-warning btn-sm">Backup</button>
            <input type="file" id="carregarArquivo" style="display:none" onchange="carregarBackup(event)">
            <button onclick="document.getElementById('carregarArquivo').click()" class="btn btn-secondary btn-sm">Carregar</button>
            <table class="table"><thead class="table-dark"><tr><th>Nome</th><th>Depto</th><th>Bruto</th><th>Liquido</th><th>Acao</th></tr></thead><tbody id="tabelaFuncionarios"></tbody></table>
            <h5>Total: <span id="totalFolha">0.00 MT</span></h5>
        </div></div>
    </div>
</div>
<script src="script.js?v=6"></script>
<script>
let roleAtual='admin';
function usarDemo(){localStorage.setItem('gestaomax_licenca_v1','DEMO');localStorage.setItem('GMX_LICENSE','DEMO');location.reload();}
const departamentosPorTipo={"EMP":["Vendas","Financas","RH","TI","Marketing","Logistica","Atendimento","Contabilidade"],"ESC":["Secretaria","Pedagogico","Tesouraria","Limpeza","Professores","Biblioteca","Cantina","Transporte"]};
function atualizarDepartamentos(){
    let tipo=document.getElementById('tipoInstituicao').value;
    let dep=document.getElementById('departamento');
    let lista=departamentosPorTipo[tipo]||[];
    dep.innerHTML='<option value="">Departamento</option>';
    lista.forEach(d=>{let o=document.createElement('option');o.value=d;o.textContent=d;dep.appendChild(o);});
    let filtro=document.getElementById('Direcao');
    if(filtro){filtro.innerHTML='<option value="">Filtrar por Depto</option>'; lista.forEach(d=>{let o=document.createElement('option');o.value=d;o.textContent=d;filtro.appendChild(o);});}
}
document.addEventListener('DOMContentLoaded',()=>{let t=document.getElementById('tipoInstituicao'); if(t) t.addEventListener('change',atualizarDepartamentos);});
function setRole(r){roleAtual=r;document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('ativo'));document.getElementById('r'+r.charAt(0).toUpperCase()+r.slice(1)).classList.add('ativo');document.getElementById('loginDono').style.display=r==='admin'?'block':'none';document.getElementById('loginFunc').style.display=r==='func'?'block':'none';document.getElementById('loginCliente').style.display=r==='cliente'?'block':'none';}
function fazerLogin(){if(document.getElementById('usuario').value==='admin'&&document.getElementById('senha').value==='1234'){document.getElementById('telaLogin').style.display='none';document.getElementById('sistema').style.display='block';listarFuncionarios();}else{document.getElementById('erroLogin').style.display='block';}}
function logout(){
  let t1 = document.getElementById('sistema'); if(t1) t1.style.display='none';
  let t2 = document.getElementById('sistemaFunc'); if(t2) t2.style.display='none';
  let t3 = document.getElementById('sistemaCliente'); if(t3) t3.style.display='none';
  let tLogin = document.getElementById('telaLogin'); if(tLogin) tLogin.style.display='block';
  let lic = verificarLicenca();
  if(!lic.ok) telaLicenca();
}
</script>
    <div id="sistemaFunc" style="display:none;" class="container mt-4">
    <div class="card shadow p-4" style="max-width:600px;margin:auto;">
        <div class="d-flex justify-content-between"><h4>Minha Situação</h4><button onclick="logout()" class="btn btn-danger btn-sm">Sair</button></div>
        <div id="dadosFunc"></div>
    </div>
</div>
<div id="sistemaCliente" style="display:none;">
    <div class="bg-primary text-white p-3 d-flex justify-content-between"><b>Catálogo</b><button onclick="logout()" class="btn btn-light btn-sm">Voltar</button></div>
    <div class="container mt-3"><div id="gridProdutos"></div></div>
</div>
</body>
</html>
