<!DOCTYPE html><html><body style="font-family:Arial;padding:20px">
<h2>Gerador de Licença GestãoMax</h2>
Nome da Empresa: <input id="empresa" placeholder="Ex: Escola Sao Joao" style="padding:10px;width:100%"><br><br>
Meses: <input id="meses" type="number" value="1" style="padding:10px"><br><br>
<button onclick="gerar()" style="padding:12px 20px;background:#1565C0;color:white;border:none;border-radius:8px;font-weight:bold">Gerar Chave</button>
<p id="out" style="background:#eee;padding:15px;word-break:break-all;margin-top:15px"></p>
<script>
function gerar(){
  let emp = document.getElementById('empresa').value.trim().toUpperCase().replace(/\s+/g,'_') || 'CLIENTE';
  let meses = parseInt(document.getElementById('meses').value)||1;
  let exp = new Date(); exp.setMonth(exp.getMonth()+meses);
  let expStr = exp.toISOString().slice(0,10).replace(/-/g,'');
  let base = `GMAX-${emp}-${expStr}`;
  let check = 0; for(let c of base) check+=c.charCodeAt(0);
  let chave = `${base}-${(check%97).toString().padStart(2,'0')}`;
  document.getElementById('out').innerHTML = `Empresa: ${emp}<br>Expira: ${exp.toLocaleDateString()}<br><br><b style="font-size:18px">${chave}</b>`;
}
</script></body></html>
